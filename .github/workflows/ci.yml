name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Bytecode compilation check
        run: python -m compileall src

      - name: Run pytest suite
        run: python -m pytest -v

      - name: Run CLI smoke checks
        run: |
          python -m batch_sentinel.cli simulate --hours 24 --cryst-min 60 --tablets 20 --vials 8 --json
          python -m batch_sentinel.cli verify-plc --scans 6 --json
          python -m batch_sentinel.cli pat-audit --samples 24 --inject-drift --json
          python -m batch_sentinel.cli trace-batch --json
          python -m batch_sentinel.cli stability --excursion-hours 8 --json
          python -m batch_sentinel.cli demo

      - name: Execute standalone examples
        run: |
          python examples/01_bioreactor_plc_campaign.py
          python examples/02_crystallizer_pill_press_pat.py
          python examples/03_aseptic_robotics_and_ebr.py
          python examples/04_full_plant_gmp_release.py
