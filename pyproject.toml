[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "batch-sentinel"
version = "0.1.0"
description = "Pharmaceutical manufacturing digital twin, IEC 61131-3 PLC safety interlock verifier, PAT multivariate SPC, and 21 CFR Part 11 GMP batch traceability simulator."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "BatchSentinel Contributors"}
]
keywords = [
    "pharmaceutical-manufacturing",
    "bioreactor-simulation",
    "iec-61131-3",
    "isa-88",
    "process-analytical-technology",
    "gmp-compliance",
    "21-cfr-part-11",
    "digital-twin"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry"
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0"
]

[project.scripts]
batch-sentinel = "batch_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
